name: Bug report
description: Report a reproducible defect in DingDongDitch
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not include credentials, private browsing data, or vulnerability
        details. Follow SECURITY.md for security reports.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest plan or code sample and exact steps.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DingDongDitch version or commit
      placeholder: 0.2.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Playwright version, and browser engine.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant output
      description: Sanitized traceback, receipt, or logs. Remove private data.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This is not a security vulnerability or support request.
          required: true
