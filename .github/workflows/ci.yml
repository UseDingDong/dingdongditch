name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[dev]"

      # A small number of boundary and CLI unit tests launch a real browser.
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run unit tests
        run: python -m pytest tests/unit -q

  browser-integration:
    name: Browser integration tests
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Install bundled browsers
        run: python -m playwright install --with-deps chromium firefox webkit

      - name: Run deterministic browser integration tests
        run: >-
          python -m pytest
          tests/integration/test_single_operation_e2e.py
          tests/integration/test_run_plan_cli.py
          -k "not headed_and_headless_override"
          -q
